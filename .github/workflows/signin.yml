name: mybt-signin

on:
  schedule:
    # 每天 01:30 UTC = 北京时间 09:30
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: mybt-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run signin
        env:
          MYBT_TOKEN: ${{ secrets.MYBT_TOKEN }}
          MYBT_USER_ID: ${{ secrets.MYBT_USER_ID }}
          MYBT_COOKIE: ${{ secrets.MYBT_COOKIE }}
          MYBT_BASE_URL: ${{ vars.MYBT_BASE_URL }}
          MYBT_SECRET: ${{ secrets.MYBT_SECRET }}
          MYBT_DO_VISIT: ${{ vars.MYBT_DO_VISIT }}
        run: python signin.py
