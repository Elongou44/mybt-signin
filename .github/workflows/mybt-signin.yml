name: mybt-signin

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
  push:
    branches: [master, main]
    paths:
      - "mybt-signin.yml"
      - "signin.py"

permissions:
  contents: read

concurrency:
  group: mybt-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run signin
        env:
          MYBT_USERNAME: ${{ secrets.MYBT_USERNAME }}
          MYBT_PASSWORD: ${{ secrets.MYBT_PASSWORD }}
          MYBT_TOKEN: ${{ secrets.MYBT_TOKEN }}
          MYBT_USER_ID: ${{ secrets.MYBT_USER_ID }}
          MYBT_COOKIE: ${{ secrets.MYBT_COOKIE }}
          MYBT_TURNSTILE_TOKEN: ${{ secrets.MYBT_TURNSTILE_TOKEN }}
          MYBT_BASE_URL: ${{ vars.MYBT_BASE_URL }}
          MYBT_AUTH_URL: ${{ vars.MYBT_AUTH_URL }}
          MYBT_SECRET: ${{ secrets.MYBT_SECRET }}
          MYBT_DO_VISIT: ${{ vars.MYBT_DO_VISIT }}
        run: python signin.py
